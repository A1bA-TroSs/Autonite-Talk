name: iOS build

# Builds and tests on GitHub's macOS runners, which come with Xcode,
# so no Mac needs a local Xcode install to compile the app.
# Public repo on a standard runner: Actions minutes are free. To keep usage low anyway,
# docs-only changes don't build, a newer push cancels the older run, and the .ipa is kept 3 days.
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'assets/**']
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos --show-sdk-version

      - name: Install xtool
        run: brew install xtool-org/tap/xtool && xtool --version

      - name: Core tests
        run: swift test

      - name: Build for device (unsigned .ipa)
        run: |
          xtool dev build --ipa
          mv xtool/Autonite.ipa "$RUNNER_TEMP/Autonite.ipa"

      - name: Build for Simulator
        run: |
          xtool dev build --triple arm64-apple-ios-simulator
          mv xtool/Autonite.app "$RUNNER_TEMP/Autonite-sim.app"

      - name: Simulator self-test
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted(k for k in devices if "iOS" in k)
          phones = [d for d in devices[ios[-1]] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$RUNNER_TEMP/Autonite-sim.app"
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Autonite-sim.app/Info.plist")
          SIMCTL_CHILD_AUTONITE_SELFTEST=1 perl -e 'alarm 120; exec @ARGV' xcrun simctl launch --console "$udid" "$bundle_id" | tee selftest.log || true
          grep -qx "autonite selftest succeeded" selftest.log

      - name: Screenshots for design review
        run: |
          udid=$(xcrun simctl list devices booted -j | python3 -c 'import json,sys; print([d["udid"] for v in json.load(sys.stdin)["devices"].values() for d in v][0])')
          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$RUNNER_TEMP/Autonite-sim.app/Info.plist")
          xcrun simctl ui "$udid" appearance dark || true
          mkdir -p screens
          for screen in setup live cue; do
            xcrun simctl terminate "$udid" "$bundle_id" || true
            SIMCTL_CHILD_AUTONITE_SCREEN=$screen xcrun simctl launch "$udid" "$bundle_id"
            sleep 6
            xcrun simctl io "$udid" screenshot "screens/$screen.png"
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: screens/
          retention-days: 3

      - name: Upload device build
        uses: actions/upload-artifact@v4
        with:
          name: Autonite-unsigned-ipa
          path: ${{ runner.temp }}/Autonite.ipa
          retention-days: 3
